
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyMate - Study Planner</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="hero">
    <h1>StudyMate 📚</h1>
    <p>Plan your studies. Track your progress.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add a Study Task</h2>

      <form id="task-form">
        <label for="subject">Subject</label>
        <input id="subject" type="text"
               placeholder="e.g. Java" required>

        <label for="task">What do you need to study?</label>
        <input id="task" type="text"
               placeholder="e.g. Practise if-else" required>

        <button type="submit">+ Add Task</button>
      </form>
    </section>

    <section class="card">
      <h2>My Progress</h2>
      <div class="stats">
        <p>Total: <strong id="total">0</strong></p>
        <p>Completed: <strong id="completed">0</strong></p>
        <p>Pending: <strong id="pending">0</strong></p>
      </div>
    </section>

    <section class="card">
      <h2>My Study Tasks</h2>
      <p id="empty-message">No tasks yet. Add your first task!</p>
      <ul id="task-list"></ul>
    </section>
  </main>

  <footer>
    <p>Built with HTML, CSS and JavaScript 💜</p>
  </footer>
</body>
</html>
